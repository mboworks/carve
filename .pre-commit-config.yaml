#
# Local quality gates. Install with `pre-commit install`; run on everything
# with `pre-commit run -a`. Mirrors the MBO Works house setup (mbo, bzl).

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: end-of-file-fixer
        # Patches carry exact bytes (a context line for a blank source line is a
        # lone " "); trimming would corrupt them.
        exclude: '\.patch$'
      - id: trailing-whitespace
        exclude: '\.patch$'

  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.0.3
    hooks:
      - id: buildifier
      - id: buildifier-lint

  # clang-format pinned to the LLVM 22 line (matches the hermetic-llvm toolchain).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        # Restrict to C/C++/CUDA sources; the default types_or also includes
        # JSON, which we do not want clang-format reformatting.
        types_or: [c, c++, cuda]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: check-version
        name: module/changelog/release version invariant
        entry: .pre-commit/check_version.sh
        language: script
        pass_filenames: false
        files: '^(MODULE\.bazel|CHANGELOG\.md|\.pre-commit/check_version\.sh|tools/trigger_release\.sh)$'

      - id: release-helpers-test
        name: release helper behavior
        entry: tools/release_helpers_test.sh
        language: script
        pass_filenames: false
        files: '^(MODULE\.bazel|CHANGELOG\.md|\.pre-commit/check_version\.sh|tools/(trigger_release|release_helpers_test)\.sh)$'

      - id: align-md-tables
        name: align Markdown table columns
        entry: python3 tools/align_md_tables.py
        language: system
        files: \.md$

      - id: cdb-diff-selftest
        name: cdb_diff self-test
        entry: python3 tools/cdb_diff.py --selftest
        language: system
        files: ^tools/cdb_diff\.py$
        pass_filenames: false

      - id: cache-cleanup-tests
        name: cache cleanup selection tests
        entry: python3 -m unittest tools/cache_cleanup_test.py
        language: system
        pass_filenames: false
        files: '^(\.github/workflows/cache_cleanup\.yml|tools/cache_cleanup(_test)?\.py)$'

      - id: ci-heartbeat-tests
        name: CI heartbeat wrapper behavior
        entry: tools/ci_with_heartbeat_test.sh
        language: script
        pass_filenames: false
        files: '^(\.github/workflows/main\.yml|tools/ci_with_heartbeat(_test)?\.sh)$'

      - id: coverage-policy-tests
        name: coverage reporting tests
        entry: python3 -m unittest tools/coverage_policy_test.py tools/coverage_data_test.py tools/coverage_index_test.py
        language: system
        pass_filenames: false
        files: '^(coverage_policy\.json|tools/coverage_(policy|data|index)(_test)?\.py|\.bazelrc|\.github/workflows/(main|coverage_pages)\.yml)$'

      - id: clang-tidy-runner-tests
        name: clang-tidy runner tests
        entry: python3 -m unittest tools/clang_tidy_test.py
        language: system
        pass_filenames: false
        files: '^tools/clang_tidy(_test)?\.py$'

      - id: blocked-merge-markers
        name: no blocked-merge markers
        entry: '(?i)do[ _-]?not[ _-]?merge'
        language: pygrep
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-em-dashes
        name: 'no em-dashes (use spaced hyphens)'
        entry: '—'
        language: pygrep
        exclude: ^\.pre-commit-config\.yaml$

      - id: todos-need-context
        name: TODO/FIXME must cite an issue URL or email
        entry: '(TODO|FIXME)(?!.*(https?://|[A-Za-z0-9._%+-]+@))'
        language: pygrep
        # Enforced on code/config, not Markdown prose that documents the rule.
        exclude: '(\.md$|^\.pre-commit-config\.yaml$)'

      - id: unqualified-matchers
        name: 'matchers in EXPECT_THAT/ASSERT_THAT must be unqualified'
        # House convention (STYLE_CPP.md "Assertions"): bring each matcher in with a
        # `using ::testing::Foo;` / `using ::mbo::testing::Foo;` in the test's
        # anonymous namespace; a qualified matcher (::testing:: / ::absl_testing:: /
        # ::mbo::testing::) written inline in an assertion is the smell to fix.
        # Multiline so it catches the matcher even on a `// NL` continuation line;
        # scoped to EXPECT_THAT/ASSERT_THAT (so fixture utilities outside an
        # assertion keep their qualification). `::testing::TempDir` is a utility, not
        # a matcher -- it often builds a path inside the assertion's value argument --
        # so it is exempted via the negative lookahead. The `::(absl_)?testing::` arm
        # also matches the `::testing::` inside `::mbo::testing::`.
        entry: '(EXPECT_THAT|ASSERT_THAT)\([^;]*::(absl_)?testing::(?!TempDir\b)'
        language: pygrep
        args: [--multiline]
        types_or: [c++]

      - id: cc-target-naming
        name: cc_library targets end in _cc
        entry: tools/check_cc_target_naming.py
        language: script
        files: '(^|/)(BUILD|BUILD\.bazel)$'
        exclude: '^third_party/'

      - id: library-test-coverage
        name: every cc_library has a direct package-local test
        entry: tools/check_cc_library_tested.py
        language: script
        files: '(^|/)(BUILD|BUILD\.bazel)$'
        exclude: '^third_party/'

      - id: explicit-test-sizes
        name: direct Bazel tests declare their size
        entry: tools/check_test_sizes.py
        language: script
        files: '(^|/)(BUILD|BUILD\.bazel)$'

      - id: build-policy-tests
        name: BUILD policy checker tests
        entry: python3 -m unittest tools/check_cc_target_naming_test.py tools/check_cc_library_tested_test.py tools/check_test_sizes_test.py tools/check_headers_test.py
        language: system
        pass_filenames: false
        files: '^tools/(build_rules|check_cc_target_naming(_test)?|check_cc_library_tested(_test)?|check_test_sizes(_test)?|check_headers(_claimed)?(_test)?)\.py$'

      - id: headers-claimed
        name: every first-party header is claimed by a BUILD target
        entry: tools/check_headers_claimed.py
        language: script
        files: '^(carve/.*\.h|carve/.*/BUILD\.bazel)$'

      - id: header-guards
        name: first-party header guards follow STYLE_CPP
        entry: tools/check_header_guards.py
        language: script
        files: '^carve/.*\.h$'

      - id: no-gtest-comparison-macros
        name: GoogleTest assertions use matchers
        entry: tools/check_test_matchers.sh
        language: script
        types_or: [c, c++]

      - id: no-comparison-in-check-macro
        name: boolean CHECKs do not contain comparisons
        entry: tools/check_check_macros.sh
        language: script
        types_or: [c, c++]

      - id: no-isok-assert-then-deref
        name: StatusOr assertions bind or match the value
        entry: tools/check_status_assert.py
        language: script
        files: '_test\.cc$'

      - id: assertion-policy-tests
        name: assertion policy checker tests
        entry: python3 -m unittest tools/check_status_assert_test.py tools/check_shell_policies_test.py
        language: system
        pass_filenames: false
        files: '^tools/(check_(status_assert|test_matchers|check_macros|shell_policies)(_test)?\.(py|sh))$'

      - id: no-braced-init-list-loop
        name: range-for uses a named collection
        entry: 'for\s*\([^)]*:\s*\{'
        language: pygrep
        types_or: [c, c++]
