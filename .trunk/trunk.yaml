# This file controls Trunk: https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
lint:
  definitions:
    - name: buildifier
      files: [starlark, bazel-build, bazel-workspace]
      tools: [buildifier]
      commands:
        - name: fix
          run: buildifier --lint=fix "${target}"
          output: rewrite
          cache_results: true
          formatter: true
          in_place: true
          batch: true
          success_codes: [0]
        - name: warn
          run: buildifier --lint=warn --format=json --mode=check "${target}"
          output: buildifier
          cache_results: true
          batch: true
          success_codes: [0]
      suggest_if: files_present
      environment:
        - name: PATH
          list: ["${linter}"]
      known_good_version: 8.5.1
      version_command:
        parse_regex: ${semver}
        run: buildifier --version
  # clang-tidy comes from the pinned LLVM distribution and has a dedicated CI
  # job. Trunk's older bundled clang-tidy must not rewrite this C++23 tree.
  # Formatting belongs to pre-commit; do not enable Prettier here because its
  # Markdown/YAML rewrites conflict with the repository's checked-in style.
  enabled:
    - buildifier@8.5.1
    - checkov@3.3.6
    - git-diff-check
    - markdownlint@0.49.0
    - trivy@0.72.0
    - trufflehog@3.95.7
    - yamllint@1.38.0
actions:
  # Git hooks belong to pre-commit.
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
