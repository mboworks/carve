name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # bazelisk launches the Bazel release pinned in .bazelversion.
      - uses: bazelbuild/setup-bazelisk@v3
      # Persist Bazel's repository cache (downloaded external deps) and disk cache
      # (compiled action outputs) so each run reuses prior work instead of fetching
      # and rebuilding from scratch -- especially useful for the large prebuilt
      # LLVM distribution and normal C++ dependencies. MODULE.bazel.lock is gitignored, so
      # the key hashes MODULE.bazel + .bazelversion; the github.sha suffix saves a
      # fresh entry per run and restore-keys fall back to the newest prior cache
      # for this OS (busted when MODULE.bazel or the Bazel version changes).
      - name: Mount Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-${{ matrix.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ matrix.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-
            bazel-${{ matrix.os }}-
      - name: bazel test
        run: bazel test --config=clang //... --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo"
      - name: Test release archive as a consumer
        env:
          CARVE_RELEASE_VERSION: "0.1.0"
        run: |
          .github/workflows/release_prep.sh >release-notes.md
          tools/release_archive_test.sh carve-0.1.0.tar.gz \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --repository_cache="$HOME/.cache/bazel-repo"

  # Sanitizers run on ubuntu only. The LLVM-linking targets are tagged `no_san`
  # and skipped; the remaining //carve/... targets are instrumented.
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-asan-ubuntu-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-asan-ubuntu-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-
            bazel-asan-ubuntu-
            bazel-ubuntu-latest-
      - name: bazel test (asan + ubsan)
        run: bazel test --config=clang --config=asan --config=ubsan //carve/... --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo"

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-tsan-ubuntu-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-tsan-ubuntu-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-
            bazel-tsan-ubuntu-
            bazel-ubuntu-latest-
      - name: bazel test (tsan)
        run: bazel test --config=clang --config=tsan //carve/... --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo"

  # MemorySanitizer catches uninitialized reads that ASan does not. It is Linux
  # x86-64 only and uses toolchains_llvm's instrumented libc++ overlay. Targets
  # tagged no_san remain excluded because their prebuilt LLVM archives use the
  # ordinary libstdc++ ABI.
  msan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Mount Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-msan-ubuntu-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-msan-ubuntu-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-
            bazel-msan-ubuntu-
            bazel-ubuntu-latest-
      - name: bazel test (msan)
        run: bazel test --config=clang --config=msan //carve/... --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Install LCOV
        run: sudo apt-get update && sudo apt-get install --yes lcov
      - name: Mount Bazel caches
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/bazel-disk
            ~/.cache/bazel-repo
          key: bazel-coverage-ubuntu-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-${{ github.sha }}
          restore-keys: |
            bazel-coverage-ubuntu-${{ hashFiles('MODULE.bazel', '.bazelversion') }}-
            bazel-coverage-ubuntu-
            bazel-ubuntu-latest-
      - name: Collect coverage
        run: bazel coverage --config=coverage //carve/... --disk_cache="$HOME/.cache/bazel-disk" --repository_cache="$HOME/.cache/bazel-repo"
      - name: Enforce coverage policy
        run: python3 tools/coverage_policy.py bazel-out/_coverage/_coverage_report.dat coverage_policy.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Render HTML report
        run: genhtml --branch-coverage --output-directory coverage-html bazel-out/_coverage/_coverage_report.dat
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: |
            bazel-out/_coverage/_coverage_report.dat
            coverage-html
          retention-days: 30

  # Single required status check: one job that gates merge on the whole matrix,
  # so branch protection needs only `done`. A yq/jq step self-checks that every
  # workflow job is wired into `needs`, so a newly added job cannot silently
  # escape the gate. Mirrors the MBO Works house pattern (mbo/bzl/xff).
  done:
    needs: [pre-commit, test, asan, tsan, msan, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure every job is wired into this gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          declared="$(yq '.jobs | keys | .[]' .github/workflows/main.yml | grep -vx 'done' | sort)"
          wired="$(jq -r 'keys[]' <<<"${NEEDS_JSON}" | sort)"
          missing="$(comm -23 <(printf '%s\n' "${declared}") <(printf '%s\n' "${wired}"))"
          if [[ -n "${missing}" ]]; then
            echo "Jobs declared in the workflow but missing from done.needs:"
            while read -r job; do
              echo "::error title=Gate is missing a job::${job} not in done.needs"
            done <<<"${missing}"
            exit 1
          fi
          echo "done covers all $(grep -c . <<<"${declared}") workflow jobs."
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
