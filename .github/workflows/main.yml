name: Test

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: write
  contents: read

jobs:
  release-site-tests:
    name: Release site tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tools -p release_site_test.py
      - run: python3 -m unittest discover -s tools -p release_notes_test.py
      - name: Test infrastructure policies
        run: python3 -m unittest discover -s tools -p "*_test.py"
      - name: Verify configured documentation and generated links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This is a disposable build on the runner, never a Pages publication.
          python3 tools/release_site.py . "${RUNNER_TEMP}/release-site-check" \
            --repository "${GITHUB_REPOSITORY}" --tag 0.0.0-verification --latest ""

  trunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: github.ref_type != 'tag'
      - name: Trunk Check
        if: github.ref_type != 'tag'
        uses: trunk-io/trunk-action@v1
        with:
          save-annotations: true
      - name: Accept policy-checked release tag
        if: github.ref_type == 'tag'
        run: echo "The tagged commit passed required Trunk checks before merge."

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

  clang-tidy:
    needs: [trunk, pre-commit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          external-cache: false
          repository-cache: false
      - uses: ./.github/actions/bazel-cache-restore
        id: cache_restore
        with:
          namespace: clang-tidy
          legacy-prefix: bazel-v2-ubuntu-clang-tidy-refs/heads/main-
      - name: Materialize generated and external headers
        # A cached top-level test object does not necessarily materialize its
        # generated transitive headers. clang-tidy reads those headers directly
        # from the execroot, so make protobuf's generated Any, SourceContext,
        # Struct, and Type headers top-level outputs before extracting the
        # compilation database.
        run: >-
          bazel build --config=ci --config=clang //...
          @protobuf//:any_cc_proto
          @protobuf//:source_context_cc_proto
          @protobuf//:struct_cc_proto
          @protobuf//:type_cc_proto
      - name: Generate the Clang compilation database
        run: bazel run --config=ci //:refresh_compile_commands
      - name: Locate the matching hermetic clang-tidy
        id: clang_tidy
        run: |
          executable="$(find "$(bazel info output_base)/external" -path '*/bin/clang-tidy' -type f -print -quit)"
          if [[ -z "${executable}" ]]; then
            echo "::error::The hermetic LLVM distribution contains no clang-tidy executable"
            exit 1
          fi
          echo "executable=${executable}" >>"${GITHUB_OUTPUT}"
      - name: Select changed translation units
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}"...HEAD -- \
            carve rules MODULE.bazel .bazelrc .clang-tidy >.clang-tidy-changed
          if grep -qEv '\.cc$' .clang-tidy-changed; then
            find carve -name '*.cc' -type f | sort >.clang-tidy-inputs
          else
            grep -E '\.cc$' .clang-tidy-changed | sort >.clang-tidy-inputs || true
          fi
      - name: Select all translation units
        if: github.event_name != 'pull_request'
        run: find carve -name '*.cc' -type f | sort >.clang-tidy-inputs
      - name: Run clang-tidy
        run: python3 tools/clang_tidy.py --jobs "$(getconf _NPROCESSORS_ONLN)" --clang-tidy "${{ steps.clang_tidy.outputs.executable }}" --files-from .clang-tidy-inputs
      - uses: ./.github/actions/bazel-cache-save
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        timeout-minutes: 20
        with:
          key: ${{ steps.cache_restore.outputs.key }}

  test:
    needs: [trunk, pre-commit]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # bazelisk launches the Bazel release pinned in .bazelversion.
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          external-cache: false
          repository-cache: false
      # Cache compiled actions only. The repository cache contains the multi-gigabyte LLVM
      # distribution and must not consume GitHub's shared 10 GB cache allowance.
      - uses: ./.github/actions/bazel-cache-restore
        id: cache_restore
        with:
          namespace: test
          legacy-prefix: bazel-v2-${{ matrix.os }}-test-refs/heads/main-
      - name: bazel test
        run: bazel test --config=ci --config=clang //...
      - name: Test release archive as a consumer
        run: |
          version="$(sed -rne 's,.*version = "([0-9]+([.][0-9]+)+.*)".*,\1,p' MODULE.bazel | head -n1)"
          export CARVE_RELEASE_VERSION="${version}"
          .github/workflows/release_prep.sh >release-notes.md
          tools/release_archive_test.sh "carve-${version}.tar.gz" \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --repository_cache="$HOME/.cache/bazel-repo"
      - uses: ./.github/actions/bazel-cache-save
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        timeout-minutes: 20
        with:
          key: ${{ steps.cache_restore.outputs.key }}

  # Sanitizers run on ubuntu only. The LLVM-linking targets are tagged `no_san`
  # and skipped; the remaining //carve/... targets are instrumented.
  asan:
    needs: [trunk, pre-commit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          external-cache: false
          repository-cache: false
      - uses: ./.github/actions/bazel-cache-restore
        id: cache_restore
        with:
          namespace: asan
          legacy-prefix: bazel-v2-ubuntu-asan-refs/heads/main-
      - name: bazel test (asan + ubsan)
        run: bazel test --config=ci --config=clang --config=asan --config=ubsan //carve/...
      - uses: ./.github/actions/bazel-cache-save
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        timeout-minutes: 20
        with:
          key: ${{ steps.cache_restore.outputs.key }}

  tsan:
    needs: [trunk, pre-commit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          external-cache: false
          repository-cache: false
      - uses: ./.github/actions/bazel-cache-restore
        id: cache_restore
        with:
          namespace: tsan
          legacy-prefix: bazel-v2-ubuntu-tsan-refs/heads/main-
      - name: bazel test (tsan)
        run: bazel test --config=ci --config=clang --config=tsan //carve/...
      - uses: ./.github/actions/bazel-cache-save
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        timeout-minutes: 20
        with:
          key: ${{ steps.cache_restore.outputs.key }}

  # MemorySanitizer catches uninitialized reads that ASan does not. It is Linux
  # x86-64 only and uses toolchains_llvm's instrumented libc++ overlay. Targets
  # tagged no_san remain excluded because their prebuilt LLVM archives use the
  # ordinary libstdc++ ABI.
  msan:
    needs: [trunk, pre-commit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          external-cache: false
          repository-cache: false
      - uses: ./.github/actions/bazel-cache-restore
        id: cache_restore
        with:
          namespace: msan
          legacy-prefix: bazel-v2-ubuntu-msan-refs/heads/main-
      - name: bazel test (msan)
        run: bazel test --config=ci --config=clang --config=msan //carve/...
      - uses: ./.github/actions/bazel-cache-save
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        timeout-minutes: 20
        with:
          key: ${{ steps.cache_restore.outputs.key }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          external-cache: false
          repository-cache: false
      - name: Install LCOV
        run: sudo apt-get update && sudo apt-get install --yes lcov
      - uses: ./.github/actions/bazel-cache-restore
        id: cache_restore
        with:
          namespace: coverage
          legacy-prefix: bazel-v2-ubuntu-coverage-refs/heads/main-
      - name: Collect coverage
        run: |
          bazel coverage --config=ci --config=coverage //carve/... \
            --profile="${RUNNER_TEMP}/coverage-preparation.json.gz" \
            --experimental_profile_additional_tasks=repository_fetch \
            --experimental_profile_additional_tasks=starlark_repository_fn \
            --experimental_profile_additional_tasks=starlark_builtin_fn \
            --experimental_profile_additional_tasks=fetch
      - name: Preserve coverage preparation profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-preparation-profile
          path: ${{ runner.temp }}/coverage-preparation.json.gz
          retention-days: 7
          if-no-files-found: warn
      - name: Apply source coverage directives
        run: |
          python3 tools/coverage_sources.py \
            bazel-out/_coverage/_coverage_report.dat coverage.lcov
      - name: Enforce coverage policy
        id: coverage_policy
        continue-on-error: true
        run: |
          python3 tools/coverage_policy.py \
            coverage.lcov coverage_policy.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json-summary coverage-summary.json
      - name: Render HTML report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            coverage_target=main
          elif [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            coverage_target="tag/${GITHUB_REF_NAME}"
          elif [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            coverage_target="pr/${PR_NUMBER}"
          else
            echo "Cannot determine coverage destination for ${GITHUB_REF}" >&2
            exit 1
          fi
          genhtml --branch-coverage --output-directory coverage-html/lcov coverage.lcov
          python3 tools/coverage_data.py coverage.lcov coverage-html/coverage-data.json
          mv coverage.lcov coverage-html/
          mv coverage-summary.json coverage-html/
          printf '%s\n' "${coverage_target}" >coverage-target.txt
          python3 tools/coverage_index.py report \
            coverage-html/coverage-summary.json "${coverage_target}" coverage-html/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage-html
            coverage-target.txt
          retention-days: 30
      - name: Fail on coverage policy violation
        if: steps.coverage_policy.outcome != 'success'
        run: exit 1
      - uses: ./.github/actions/bazel-cache-save
        if: "!cancelled() && github.ref == 'refs/heads/main'"
        timeout-minutes: 20
        with:
          key: ${{ steps.cache_restore.outputs.key }}

  # Single required status check: one job that gates merge on the whole matrix,
  # so branch protection needs only `done`. A yq/jq step self-checks that every
  # workflow job is wired into `needs`, so a newly added job cannot silently
  # escape the gate. Mirrors the MBO Works house pattern (mbo/bzl/xff).
  done:
    needs: [release-site-tests, trunk, pre-commit, clang-tidy, test, asan, tsan, msan, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure every job is wired into this gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          declared="$(yq '.jobs | keys | .[]' .github/workflows/main.yml | grep -vx 'done' | sort)"
          wired="$(jq -r 'keys[]' <<<"${NEEDS_JSON}" | sort)"
          missing="$(comm -23 <(printf '%s\n' "${declared}") <(printf '%s\n' "${wired}"))"
          if [[ -n "${missing}" ]]; then
            echo "Jobs declared in the workflow but missing from done.needs:"
            while read -r job; do
              echo "::error title=Gate is missing a job::${job} not in done.needs"
            done <<<"${missing}"
            exit 1
          fi
          echo "done covers all $(grep -c . <<<"${declared}") workflow jobs."
      - uses: actions/download-artifact@v8
        if: always() && github.ref == 'refs/heads/main'
        with:
          pattern: cache-metrics-*
          path: cache-metrics
          merge-multiple: true
      - name: Report cache storage
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh cache list --limit 10000 --json key,ref,sizeInBytes >cache-inventory.json; then
            python3 tools/cache_report.py --metrics cache-metrics --inventory cache-inventory.json >>"${GITHUB_STEP_SUMMARY}"
          else
            echo 'Cache inventory unavailable.' >>"${GITHUB_STEP_SUMMARY}"
          fi
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
