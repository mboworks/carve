name: Publish coverage
run-name: Publish retained coverage after Test run ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

concurrency:
  group: coverage-pages
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      pages: write
      pull-requests: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Select report destination
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ "${HEAD_BRANCH}" = "main" ]; then
            target=main
          elif [[ "${HEAD_BRANCH}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            target="tag/${HEAD_BRANCH}"
          else
            # actionlint/shellcheck cannot see that workflow env declarations assign this value.
            # shellcheck disable=SC2153
            pr_number="${PR_NUMBER}"
            if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
              pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq '.[0].number // empty')"
            fi
            if [[ ! "${pr_number}" =~ ^[1-9][0-9]*$ ]]; then
              echo "No pull request owns ${HEAD_SHA}; retaining only the run artifact."
              echo "publish=false" >>"${GITHUB_OUTPUT}"
              exit 0
            fi
            target="pr/${pr_number}"
          fi
          echo "publish=true" >>"${GITHUB_OUTPUT}"
          echo "target=${target}" >>"${GITHUB_OUTPUT}"
      - uses: actions/checkout@v7
        if: steps.target.outputs.publish == 'true'
        with:
          path: source
          ref: main
      - uses: actions/checkout@v7
        if: steps.target.outputs.publish == 'true'
        with:
          path: site
          ref: coverage-pages
      - uses: actions/download-artifact@v8
        if: steps.target.outputs.publish == 'true'
        with:
          github-token: ${{ github.token }}
          name: coverage-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
      - name: Stage and index report
        if: steps.target.outputs.publish == 'true'
        env:
          EXPECTED_TARGET: ${{ steps.target.outputs.target }}
          SOURCE_COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
          SOURCE_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: |
          set -euo pipefail
          target="$(<report/coverage-target.txt)"
          if [[ ! "${target}" =~ ^(main|pr/[1-9][0-9]*|tag/[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Invalid coverage target: ${target}" >&2
            exit 1
          fi
          if [ "${target}" != "${EXPECTED_TARGET}" ]; then
            echo "Coverage target ${target} does not match ${EXPECTED_TARGET}" >&2
            exit 1
          fi
          python3 source/tools/coverage_index.py metadata \
            report/coverage-html/coverage-summary.json "${target}" \
            report/coverage-html/coverage-meta.json \
            --completed-at "${SOURCE_COMPLETED_AT}" \
            --created-at "${SOURCE_CREATED_AT}" \
            --head-sha "${SOURCE_HEAD_SHA}" \
            --run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --run-id "${SOURCE_RUN_ID}" \
            --started-at "${SOURCE_STARTED_AT}"
          current="site/coverage/${target}/coverage-meta.json"
          if [[ -f "${current}" ]] && ! python3 source/tools/coverage_index.py newer \
            report/coverage-html/coverage-meta.json "${current}"; then
            echo "Ignoring older ${target} report from run ${SOURCE_RUN_ID}"
          else
            mkdir -p "site/coverage/${target}"
            rsync --archive --delete report/coverage-html/ "site/coverage/${target}/"
          fi
          python3 source/tools/coverage_index.py regenerate site/coverage
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add coverage
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "coverage: publish ${target} from run ${SOURCE_RUN_ID}"
            git -C site push
          fi
          mkdir -p public/coverage
          rsync --archive --delete site/coverage/ public/coverage/
      - uses: actions/upload-pages-artifact@v5
        if: steps.target.outputs.publish == 'true'
        with:
          path: public
      - name: Deploy coverage to GitHub Pages
        id: deployment
        if: steps.target.outputs.publish == 'true'
        uses: actions/deploy-pages@v5
